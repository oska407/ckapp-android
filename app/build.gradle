plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ckapp.checkin'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ckapp.checkin'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.12'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def rel = signingConfigs.maybeCreate("release")
            rel.storeFile = file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
            rel.storePassword = System.getenv("KEYSTORE_PASSWORD")
            rel.keyAlias = System.getenv("KEY_ALIAS")
            rel.keyPassword = System.getenv("KEY_PASSWORD")
            signingConfig = rel
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig = true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'            // WebView 能力
    implementation 'androidx.security:security-crypto:1.1.0'  // EncryptedSharedPreferences
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'      // M4 SSE 长连核心
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'   // M4 SSE EventSource
    implementation 'com.google.mlkit:barcode-scanning:17.3.0' // M3 扫码主路径
    // M3 扫码相机（CameraX）
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
